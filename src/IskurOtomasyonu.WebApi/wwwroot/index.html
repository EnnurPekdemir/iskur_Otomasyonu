<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-50 dark:bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknoloji Fakültesi İŞKUR Öğrenci Otomasyonu</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Pro CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- QRCode.js (Dinamik Karekod Üretici) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Html5-QRCode (Kamera / QR Tarayıcı) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Özel Tasarım & Animasyon CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="h-full text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- ==================================================================== -->
    <!-- 1. GİRİŞ & KAYIT EKRANI (AUTH VIEW) -->
    <!-- ==================================================================== -->
    <div id="auth-view" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 relative overflow-hidden">
        <!-- Arka Plan Dekoratif Işık Efektleri -->
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-full max-w-md bg-white/95 dark:bg-slate-900/90 backdrop-blur-xl border border-white/20 dark:border-slate-800/80 rounded-3xl shadow-2xl p-6 sm:p-8 relative z-10 animate-scaleIn">
            <!-- Logo & Başlık -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 mb-4 ring-4 ring-indigo-500/20">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Teknoloji Fakültesi</h2>
                <p class="text-xs uppercase tracking-widest font-semibold text-indigo-600 dark:text-indigo-400 mt-1">
                    İŞKUR Öğrenci Otomasyon Sistemi
                </p>
            </div>

            <!-- Giriş / Kayıt Sekmeleri -->
            <div class="flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 mb-6">
                <button id="auth-tab-login" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm transition">
                    Giriş Yap
                </button>
                <button id="auth-tab-register" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
                    Öğrenci Kaydı
                </button>
            </div>

            <!-- Giriş Formu -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">
                        Kullanıcı Adı veya E-Posta
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-envelope text-xs"></i>
                        </span>
                        <input type="text" id="login-identifier" required placeholder="ornek@universite.edu.tr" 
                            class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-slate-100">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">
                        Parola
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="login-password" required placeholder="••••••••" 
                            class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-slate-100">
                    </div>
                </div>

                <button type="submit" id="login-btn" 
                    class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/30 transition duration-150 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                    <span>Sisteme Giriş Yap</span>
                </button>
            </form>

            <!-- Öğrenci Kayıt Formu (Varsayılan Gizli) -->
            <form id="register-form" class="space-y-3 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Ad</label>
                        <input type="text" id="reg-firstname" required placeholder="Ahmet" 
                            class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Soyad</label>
                        <input type="text" id="reg-lastname" required placeholder="Yılmaz" 
                            class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Öğrenci Numarası</label>
                    <input type="text" id="reg-studentno" required placeholder="2210206001" 
                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">E-Posta</label>
                    <input type="email" id="reg-email" required placeholder="ogrenci@universite.edu.tr" 
                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Bölüm</label>
                    <select id="reg-dept" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                        <option value="">Bölüm Seçiniz...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">T.C. Kimlik No (KVKK Şifreli)</label>
                    <input type="text" id="reg-tcno" maxlength="11" required placeholder="11 haneli TCKN" 
                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">IBAN (KVKK Şifreli)</label>
                    <input type="text" id="reg-iban" required placeholder="TR00 0000 0000 0000 0000 0000 00" 
                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-xs">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Parola</label>
                    <input type="password" id="reg-password" required placeholder="En az 6 karakter" 
                        class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                </div>

                <button type="submit" id="register-btn" 
                    class="w-full mt-2 py-2.5 px-4 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-check text-xs"></i>
                    <span>Kayıt Ol</span>
                </button>
            </form>

            <!-- Hızlı Demo Giriş Kısayolları -->
            <div class="mt-8 pt-6 border-t border-slate-200/60 dark:border-slate-800/60">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 text-center mb-3">
                    Hızlı Demo Giriş Seçenekleri
                </p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="window.authManager.quickLogin('ogrenci')" 
                        class="py-2 px-2.5 rounded-xl border border-indigo-200 dark:border-indigo-900 bg-indigo-50/50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 transition font-medium flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-user-graduate"></i>
                        <span>Öğrenci</span>
                    </button>
                    <button type="button" onclick="window.authManager.quickLogin('danisman')" 
                        class="py-2 px-2.5 rounded-xl border border-blue-200 dark:border-blue-900 bg-blue-50/50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 hover:bg-blue-100 transition font-medium flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Danışman</span>
                    </button>
                    <button type="button" onclick="window.authManager.quickLogin('bolumbaskani')" 
                        class="py-2 px-2.5 rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50/50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 hover:bg-amber-100 transition font-medium flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <span>Bölüm Bşk.</span>
                    </button>
                    <button type="button" onclick="window.authManager.quickLogin('dekanlik')" 
                        class="py-2 px-2.5 rounded-xl border border-purple-200 dark:border-purple-900 bg-purple-50/50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 hover:bg-purple-100 transition font-medium flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-landmark"></i>
                        <span>Dekanlık</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================================================================== -->
    <!-- 2. ANA UYGULAMA İSKELETİ (APP SHELL) -->
    <!-- ==================================================================== -->
    <div id="app-shell" class="min-h-screen flex flex-col md:flex-row hidden">
        <!-- Sol Kenar Çubuğu (Sidebar) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 md:static">
            <!-- Sidebar Başlığı -->
            <div class="h-16 flex items-center px-6 border-b border-slate-100 dark:border-slate-800 gap-3">
                <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
                    <i class="fa-solid fa-graduation-cap"></i>
                </span>
                <div>
                    <h1 class="font-extrabold text-sm tracking-tight text-slate-900 dark:text-white leading-none">İŞKUR Otomasyonu</h1>
                    <span class="text-[10px] text-slate-400 font-medium">Teknoloji Fakültesi</span>
                </div>
            </div>

            <!-- Dinamik Navigasyon Menüsü -->
            <div id="sidebar-nav" class="flex-1 overflow-y-auto px-4 py-5 space-y-1">
                <!-- app.js tarafından roller doğrultusunda doldurulur -->
            </div>

            <!-- Alt Güvenli Çıkış Butonu -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-800">
                <button id="logout-btn" class="w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Güvenli Çıkış</span>
                </button>
            </div>
        </aside>

        <!-- Sağ Ana İçerik Alanı -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Üst Navigasyon Çubuğu (Top Bar) -->
            <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30">
                <div class="flex items-center gap-3">
                    <!-- Mobil Menü Butonu -->
                    <button id="mobile-menu-btn" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    
                    <span class="inline-flex items-center gap-2 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Canlı Sistem v1.0</span>
                    </span>
                </div>

                <!-- Sağ Üst Profil & Tema Seçenekleri -->
                <div class="flex items-center gap-3">
                    <!-- Tema Değiştirici -->
                    <button id="theme-toggle-btn" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition">
                        <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                        <i class="fa-solid fa-sun hidden dark:block text-sm text-amber-400"></i>
                    </button>

                    <!-- Kullanıcı Bilgisi ve Menüsü -->
                    <div class="relative">
                        <button id="user-menu-btn" class="flex items-center gap-2.5 p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                            <div id="topbar-user-avatar" class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                                U
                            </div>
                            <div class="text-left hidden sm:block">
                                <div id="topbar-user-name" class="text-xs font-bold text-slate-900 dark:text-white leading-tight truncate max-w-[140px]">Kullanıcı</div>
                                <div id="topbar-user-role" class="text-[10px] text-slate-400 leading-tight">Rol</div>
                            </div>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                        </button>

                        <!-- Kullanıcı Dropdown -->
                        <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 py-1.5 z-50 animate-scaleIn">
                            <a href="#profile" id="nav-profile-btn" class="flex items-center gap-2 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
                                <i class="fa-solid fa-id-card text-slate-400"></i>
                                <span>Profil ve Görev Bilgileri</span>
                            </a>
                            <div class="border-t border-slate-100 dark:border-slate-800 my-1"></div>
                            <button id="mobile-logout-btn" class="w-full flex items-center gap-2 px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span>Oturumu Kapat</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dinamik Modül Görünümleri (Dashboard Panelleri) -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
                <div id="student-dashboard-view" class="hidden"></div>
                <div id="advisor-dashboard-view" class="hidden"></div>
                <div id="department-dashboard-view" class="hidden"></div>
                <div id="dean-dashboard-view" class="hidden"></div>
                <div id="profile-view" class="hidden"></div>
            </main>
        </div>
    </div>

    <!-- ==================================================================== -->
    <!-- 3. BİLDİRİM KONTEYNERI (TOAST CONTAINER) -->
    <!-- ==================================================================== -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- ==================================================================== -->
    <!-- 4. MODÜLER JAVASCRIPT DOSYALARI -->
    <!-- ==================================================================== -->
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/qrScannerComponent.js"></script>
    <script src="js/studentDashboard.js"></script>
    <script src="js/advisorDashboard.js"></script>
    <script src="js/departmentDashboard.js"></script>
    <script src="js/deanDashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
